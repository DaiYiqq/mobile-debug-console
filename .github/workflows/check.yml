name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PWA 同步检查（index.html 与本体一致）
        run: |
          python3 scripts/sync-pwa.py
          git diff --exit-code -- index.html
      - name: 安装包可复现构建检查（解包内容一致）
        run: |
          python3 scripts/verify-release.py
