name: "✨ 功能建议（Feature Request）"
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 欢迎提出想法。请描述清楚使用场景，越具体越容易被实现。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么场景下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它长什么样、怎么操作？
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 已尝试的替代方案（可选）
  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
